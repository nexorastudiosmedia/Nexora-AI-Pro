name: Daily Reel Post (Twice a Day)

on:
  schedule:
    # 3:00 PM ET (Reel post, separate from morning text post) — 19:00 UTC
    - cron: '0 19 * * *'
    # 7:30 PM ET (second reel — was an image post, moved here since Reels get more organic reach) — 23:30 UTC
    - cron: '30 23 * * *'
  workflow_dispatch:  # allows manual trigger anytime from GitHub UI

jobs:
  post-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reel pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python run_reel_pipeline.py
