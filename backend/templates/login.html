<form method="POST" action="/">

    <input
        type="email"
        name="email"
        class="form-control mb-3"
        placeholder="Email"
        required>

    <input
        type="password"
        name="password"
        class="form-control mb-4"
        placeholder="Password"
        required>

    <button class="btn btn-info w-100">
        Login
    </button>

</form>
